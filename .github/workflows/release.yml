name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (leave empty for a dry run)
        required: false
        type: string
        default: ""

permissions: {}

concurrency:
  group: "release-${{ inputs.tag || github.ref_name }}"
  cancel-in-progress: false

jobs:
  dry-run:
    if: github.event_name == 'workflow_dispatch' && inputs.tag == ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      COMMIT: "${{ github.sha }}"
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the dispatched commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: "${{ github.sha }}"
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
          package-manager-cache: false
      - name: Set build metadata from the dispatched commit
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$COMMIT"
          echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct "$COMMIT")" >> "$GITHUB_ENV"
          node --input-type=module <<'JS'
          import { appendFileSync, readFileSync } from 'node:fs';
          const { version } = JSON.parse(readFileSync('package.json', 'utf8'));
          appendFileSync(process.env.GITHUB_ENV, `VERSION=${version}\n`);
          JS
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build the package and SBOM
        run: |
          set -euo pipefail
          mkdir dist
          npm pack --ignore-scripts --pack-destination dist
          test -f "dist/scanmux-$VERSION.tgz"
          npm sbom --sbom-format cyclonedx > "dist/scanmux-$VERSION.cdx.json"
      - name: Verify the installed package
        run: node scripts/ci-installed-package.mjs --tgz "dist/scanmux-$VERSION.tgz"
      - name: Attest the build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: Generate SHA256 checksums
        run: |
          set -euo pipefail
          (
            cd dist
            sha256sum -- "scanmux-$VERSION.tgz" "scanmux-$VERSION.cdx.json"
          ) > SHA256SUMS
      - name: Upload provenance artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scanmux-provenance-${{ github.run_id }}-a${{ github.run_attempt }}
          path: |
            dist/scanmux-${{ env.VERSION }}.tgz
            dist/scanmux-${{ env.VERSION }}.cdx.json
            SHA256SUMS
          if-no-files-found: error
          retention-days: 3
  release:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.tag != '')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      TAG: "${{ inputs.tag || github.ref_name }}"
    defaults:
      run:
        shell: bash
    steps:
      - name: Validate the release tag before checkout
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
      - name: Check out the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: "refs/tags/${{ env.TAG }}"
          persist-credentials: false
          fetch-depth: 0
      - name: Verify the checked-out commit and set build metadata
        run: |
          set -euo pipefail
          tag_commit=$(git rev-parse --verify "refs/tags/$TAG^{commit}")
          test "$(git rev-parse HEAD)" = "$tag_commit"
          echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct "$tag_commit")" >> "$GITHUB_ENV"
          echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
          package-manager-cache: false
      - name: Verify the tag and package versions
        run: |
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          const { version } = JSON.parse(readFileSync('package.json', 'utf8'));
          if (process.env.TAG !== `v${version}`) throw new Error('Tag/package version mismatch');
          JS
      - name: Refuse to overwrite an existing release
        run: |
          set -euo pipefail
          if release_response=$(gh api --include --silent "repos/$GITHUB_REPOSITORY/releases/tags/$TAG"); then
            echo "Release already exists" >&2
            exit 1
          fi
          status_line=${release_response%%$'\n'*}
          if [[ ! "$status_line" =~ ^HTTP/[0-9.]+[[:space:]]404([[:space:]]|$) ]]; then
            echo "Could not determine whether the release exists" >&2
            exit 1
          fi
        env:
          GH_TOKEN: "${{ github.token }}"
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build the package and SBOM
        run: |
          set -euo pipefail
          mkdir dist
          npm pack --ignore-scripts --pack-destination dist
          test -f "dist/scanmux-$VERSION.tgz"
          npm sbom --sbom-format cyclonedx > "dist/scanmux-$VERSION.cdx.json"
      - name: Verify the installed package
        run: node scripts/ci-installed-package.mjs --tgz "dist/scanmux-$VERSION.tgz"
      - name: Attest the build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: Generate SHA256 checksums
        run: |
          set -euo pipefail
          (
            cd dist
            sha256sum -- "scanmux-$VERSION.tgz" "scanmux-$VERSION.cdx.json"
          ) > SHA256SUMS
      - name: Create a draft release
        run: |
          gh release create "$TAG" "dist/scanmux-$VERSION.tgz" "dist/scanmux-$VERSION.cdx.json" SHA256SUMS --draft --verify-tag --title "ScanMux $VERSION" --notes "Release notes will be added before publishing."
        env:
          GH_TOKEN: "${{ github.token }}"
