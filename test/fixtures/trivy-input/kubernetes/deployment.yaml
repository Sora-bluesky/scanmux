apiVersion: apps/v1
kind: Deployment
metadata:
  name: insecure-demo
spec:
  replicas: 1
  selector:
    matchLabels: {app: insecure-demo}
  template:
    metadata:
      labels: {app: insecure-demo}
    spec:
      containers:
        - name: demo
          image: nginx:1.27
          securityContext:
            privileged: true
