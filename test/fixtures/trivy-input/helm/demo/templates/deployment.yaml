apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-demo
spec:
  replicas: 1
  selector:
    matchLabels: {app: helm-demo}
  template:
    metadata:
      labels: {app: helm-demo}
    spec:
      containers:
        - name: demo
          image: {{ .Values.image }}
          securityContext:
            privileged: {{ .Values.privileged }}
